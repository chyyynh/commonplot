packages:
  - .
confirmModulesPurge: false
storeDir: ../../.pnpm-store
optimisticRepeatInstall: false
trustLockfile: true
verifyDepsBeforeRun: error
virtualStoreType: project
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
patchedDependencies:
  defuddle@0.19.4: patches/defuddle@0.19.4.patch
minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.0'
  - '@cloudflare/codemods@0.4.2'
  - '@cloudflare/config@0.24.1'
  - '@cloudflare/runtime-types@0.1.9'
  - cf@1.0.0-beta.14
  - miniflare@5.20261006.1-alpha
