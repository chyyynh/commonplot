packages:
  - .
confirmModulesPurge: false
storeDir: ../../.pnpm-store
optimisticRepeatInstall: false
trustLockfile: true
verifyDepsBeforeRun: error
virtualStoreType: project
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
patchedDependencies:
  defuddle@0.19.4: patches/defuddle@0.19.4.patch

# Install new releases immediately (pnpm 11 defaults to a one-day delay).
minimumReleaseAge: 0
